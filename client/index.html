<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Vendor Invoice Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-5">

<div class="invoice-card">

    <div class="text-center mb-4">

        <h2>Vendor Invoice Portal</h2>

        <p class="text-secondary">
            Submit multiple invoices in one submission
        </p>

    </div>

    <div class="mb-4">

        <label class="form-label">

            Vendor Name

        </label>

        <input
            type="text"
            id="vendorName"
            class="form-control"
            placeholder="PT Name">

    </div>

<form id="invoiceForm">

<div class="table-responsive">

<table class="table table-bordered align-middle text-center" id="invoiceTable">

<thead>

<tr>

<th width="150">Invoice No</th>

<th width="150">Invoice Date</th>

<th>Description</th>

<th width="90">Qty</th>

<th width="160">Unit Price</th>

<th width="160">Total</th>

<th width="150">Status</th>

<th width="70"></th>

</tr>

</thead>

<tbody id="invoiceBody">

<tr>

<td>

<input
class="form-control invoiceNo">

</td>

<td>

<input
type="date"
class="form-control invoiceDate">

</td>

<td>

<input
class="form-control description">

</td>

<td>

<input
type="number"
class="form-control qty"
value="1"
min="1">

</td>

<td>

<input
type="number"
class="form-control unitPrice">

</td>

<td>

<input
class="form-control total"
readonly>

</td>

<td>

<select class="form-select status">

<option>Belum Bayar</option>

<option>Lunas</option>

</select>

</td>

<td>

<button
type="button"
class="btn btn-danger removeRow">

✕

</button>

</td>

</tr>

</tbody>

</table>

</div>

<div class="mt-3">

<button
type="button"
id="addInvoice"
class="btn btn-success">

+ Add Invoice

</button>

</div>

<hr>

<div class="row">

<div class="col-md-6">

<h4>

Total Invoice

<span id="invoiceCount">

1

</span>

</h4>

</div>

<div class="col-md-6 text-end">

<h4>

Grand Total

<span id="grandTotal">

Rp 0

</span>

</h4>

</div>

</div>

<button
        class="btn btn-primary flex-fill"
        type="submit">

        Submit All Invoices

    </button>

    <a
        href="invoices.html"
        class="btn btn-outline-primary flex-fill">

        View Invoices

    </a>

</form>

</div>

</div>

<script src="js/invoice.js"></script>

</body>

</html>
