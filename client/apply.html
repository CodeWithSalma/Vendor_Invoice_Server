<form id="invoiceForm">

    <div class="mb-3">
        <label class="form-label">Full Name *</label>
        <input
            type="text"
            class="form-control"
            id="fullName">
    </div>

    <div class="mb-3">
        <label>Email *</label>
        <input
            type="email"
            class="form-control"
            id="email">
    </div>

    <div class="mb-3">
        <label>Phone Number *</label>
        <input
            type="text"
            class="form-control"
            id="phone">
    </div>

    <div class="mb-3">
        <label>Position</label>

        <select
            class="form-select"
            id="position">

            <option value="">Choose Position</option>
            <option>QA Automation Engineer</option>
            <option>RPA Developer</option>
            <option>DevOps Engineer</option>

        </select>

    </div>

    <div class="mb-3">

        <label>Education</label>

        <select
            class="form-select"
            id="education">

            <option value="">Choose</option>
            <option>SMA</option>
            <option>Diploma</option>
            <option>Bachelor</option>
            <option>Master</option>

        </select>

    </div>

    <button
        class="btn btn-primary w-100"
        type="submit">

        Submit Application

    </button>

</form>

<script src="js/invoice.js"></script>
